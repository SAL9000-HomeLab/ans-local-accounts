---
# roles/ans_local_accounts/tasks/linux.yml

- name: Create local groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid | default(omit) }}"
    system: "{{ item.system | default(false) | bool }}"
    state: present
  loop: "{{ ans_local_accounts__groups | selectattr('state', '==', 'present') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create local users
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: "{{ item.shell | default(omit) }}"
    home: "{{ item.home | default(omit) }}"
    create_home: "{{ item.create_home | default(true) | bool }}"
    system: "{{ item.system | default(false) | bool }}"
    state: present
  loop: "{{ ans_local_accounts__users | selectattr('state', '==', 'present') | selectattr('create') }}"
  loop_control:
    label: "{{ item.name }}"

# Users with `create: false` belong to something else, usually SSSD for domain users: the role never creates or removes
# them, and manages their home, groups and keys only when the account resolves. getent goes through NSS, so it finds
# domain users that `getent passwd` without a key does not list.
- name: Look up the accounts the role does not create
  ansible.builtin.getent:
    database: passwd
    key: "{{ item.name }}"
    fail_key: false
  loop: "{{ ans_local_accounts__users | selectattr('state', '==', 'present') | rejectattr('create') }}"
  loop_control:
    label: "{{ item.name }}"
  register: ans_local_accounts__account_lookup

- name: Work out which of those accounts exist
  ansible.builtin.set_fact:
    ans_local_accounts__found_accounts: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in ans_local_accounts__account_lookup.results -%}
      {%-   set entry = r.ansible_facts.getent_passwd[r.item.name] -%}
      {%-   if entry -%}
      {%-     set ns.out = ns.out + [{'name': r.item.name, 'home': entry[4],
                                     'create_home': r.item.create_home | default(true) | bool}] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.out }}
    ans_local_accounts__missing_users: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in ans_local_accounts__account_lookup.results -%}
      {%-   if not r.ansible_facts.getent_passwd[r.item.name] -%}
      {%-     set ns.out = ns.out + [r.item.name] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Report the accounts that do not resolve on this host
  ansible.builtin.debug:
    msg: "Not found on this host, home, groups and keys skipped: {{ ans_local_accounts__missing_users | join(', ') }}"
  when: ans_local_accounts__missing_users | length > 0

# mkhomedir_helper is what pam_mkhomedir runs at first login: it copies /etc/skel and sets the owner. The umask makes
# the home directory 0700. The path comes from NSS.
- name: Create the home directories of accounts the role does not create
  ansible.builtin.command:
    argv: [mkhomedir_helper, "{{ item.name }}", "0077"]
    creates: "{{ item.home }}"
  loop: "{{ ans_local_accounts__found_accounts | selectattr('create_home') }}"
  loop_control:
    label: "{{ item.name }}"
  register: ans_local_accounts__mkhomedir

- name: Restore the SELinux labels of the new home directories
  ansible.builtin.command:
    argv: [restorecon, -R, "{{ item.item.home }}"]
  loop: "{{ ans_local_accounts__mkhomedir.results | selectattr('changed') }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
  changed_when: true

# Membership is changed with gpasswd rather than the user module, so a group's member list can be managed as a
# whole and can include accounts the role does not create. The current members come from the group database.
- name: Read the current group members
  ansible.builtin.getent:
    database: group

- name: Check that every group with managed members exists
  ansible.builtin.assert:
    that: item.name in ansible_facts['getent_group']
    fail_msg: "Group {{ item.name }} does not exist: add it to ans_local_accounts_groups or drop it from users' groups"
    quiet: true
  loop: "{{ ans_local_accounts__memberships }}"
  loop_control:
    label: "{{ item.name }}"

# An exclusive group with a member that does not resolve is left alone: the account may only be unreachable for now
# (SSSD offline), and gpasswd -M would drop it from the group.
- name: Report the exclusive groups left alone
  ansible.builtin.debug:
    msg: >-
      Exclusive group {{ item.name }} not changed, because these members do not resolve on this host:
      {{ item.members | intersect(ans_local_accounts__missing_users) | join(', ') }}
  loop: "{{ ans_local_accounts__memberships | selectattr('exclusive') }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.members | intersect(ans_local_accounts__missing_users) | length > 0

- name: Set the member list of exclusive groups
  ansible.builtin.command:
    argv: [gpasswd, -M, "{{ item.members | unique | join(',') }}", "{{ item.name }}"]
  loop: "{{ ans_local_accounts__memberships | selectattr('exclusive') }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.members | intersect(ans_local_accounts__missing_users) | length == 0
    - >-
      item.members | unique | sort !=
      ansible_facts['getent_group'][item.name][2] | split(',') | select | sort
  changed_when: true

- name: Add members to non-exclusive groups
  ansible.builtin.command:
    argv: [gpasswd, -a, "{{ item.1 }}", "{{ item.0.name }}"]
  loop: "{{ ans_local_accounts__memberships | rejectattr('exclusive') | subelements('members') }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"
  when:
    - item.1 not in ans_local_accounts__missing_users
    - item.1 not in ansible_facts['getent_group'][item.0.name][2] | split(',')
  changed_when: true

- name: Manage SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.authorized_keys | join('\n') }}"
    exclusive: "{{ item.authorized_keys_exclusive | default(ans_local_accounts_authorized_keys_exclusive) | bool }}"
    state: present
  loop: "{{ ans_local_accounts__users | selectattr('state', '==', 'present') }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.authorized_keys | default([]) | length > 0
    - item.name not in ans_local_accounts__missing_users

# One sudoers file per user and group in the lists. Groups are written as %name. sudo skips files in
# /etc/sudoers.d whose name contains a dot, so dots in names become underscores in the file name.
- name: Work out the sudoers files
  ansible.builtin.set_fact:
    ans_local_accounts__sudoers: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for kind, accounts in [('user', ans_local_accounts__users), ('group', ans_local_accounts__groups)] -%}
      {%-   for a in accounts -%}
      {%-     set ns.out = ns.out + [{
                'principal': ('%' if kind == 'group' else '') ~ a.name,
                'file': ans_local_accounts_sudoers_prefix ~ kind ~ '-' ~ a.name | regex_replace('[.~]', '_'),
                'rules': a.sudo | default([]) if a.state == 'present' else []}] -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Write sudoers rules
  ansible.builtin.template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ item.file }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ ans_local_accounts__sudoers | selectattr('rules') }}"
  loop_control:
    label: "{{ item.principal }}"

- name: Remove sudoers rules no longer wanted
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.file }}"
    state: absent
  loop: "{{ ans_local_accounts__sudoers | rejectattr('rules') }}"
  loop_control:
    label: "{{ item.principal }}"

- name: Remove local users
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: absent
    remove: "{{ ans_local_accounts_remove_home | bool }}"
  loop: "{{ ans_local_accounts__users | selectattr('state', '==', 'absent') | selectattr('create') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove local groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    state: absent
  loop: "{{ ans_local_accounts__groups | selectattr('state', '==', 'absent') }}"
  loop_control:
    label: "{{ item.name }}"
